<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квест: Створення та публікація веб-ресурсів</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --success: #10b981;
            --error: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .quiz-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            max-width: 650px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }
        .quiz-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .quiz-header h1 {
            color: var(--primary);
            font-size: 1.6rem;
            margin-bottom: 8px;
        }
        .quiz-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }
        .input-group label {
            display: block;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--primary);
        }
        .progress-container {
            width: 100%;
            background: #0f172a;
            height: 6px;
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
            display: none;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        h2 {
            font-size: 1.25rem;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background-color: #0f172a;
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #1e293b;
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        .option-btn.correct {
            background-color: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--success) !important;
            color: #34d399;
            font-weight: bold;
        }
        .option-btn.wrong {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--error) !important;
            color: #f87171;
        }
        .main-btn {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .main-btn:hover {
            background-color: var(--primary-hover);
        }
        .result-screen {
            text-align: center;
        }
        .score-badge {
            font-size: 4rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        .analysis-container {
            text-align: left;
            margin-top: 30px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            max-height: 350px;
            overflow-y: auto;
        }
        .analysis-item {
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #0f172a;
            border-left: 4px solid #475569;
        }
        .analysis-item.correct-item {
            border-left-color: var(--success);
            background: rgba(16, 185, 129, 0.05);
        }
        .analysis-item.wrong-item {
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.05);
        }
        .analysis-q {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .analysis-ans {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        .analysis-ans strong {
            color: #34d399;
        }
    </style>
</head>
<body>

<div class="quiz-card" id="quiz">
    <div class="progress-container" id="progress-area">
        <div class="progress-bar" id="progress"></div>
    </div>
    
    <div id="quiz-content">
        <div class="quiz-header">
            <h1>Квест: Створення та публікація веб-ресурсів</h1>
            <p>Й. Ривкінд, НУШ 8 клас • Інтерактивне тестування</p>
        </div>
        <div class="input-group">
            <label for="student-name">Введіть ваше Прізвище та Ім'я:</label>
            <input type="text" id="student-name" placeholder="Наприклад: Шевченко Тарас">
        </div>
        <button class="main-btn" onclick="validateAndStart()">Розпочати квест</button>
    </div>
</div>
<script>
    const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/1STUWqV7Iwj-YnE5WVWYPqwSTIvlYuIB6rD_LThCQcHc/preview"; 
    const NAME_ENTRY_ID = "entry.478427886";   
    const SCORE_ENTRY_ID = "entry.1193998476";

    const quizData = [
        {
            question: "Що таке веб-сайт?",
            answers: [
                { text: "Сукупність веб-сторінок, пов'язаних за змістом та навігацією", correct: true },
                { text: "Будь-який текстовий документ, створений на комп'ютері", correct: false },
                { text: "Програма для перегляду сторінок в Інтернеті", correct: false }
            ]
        },
        {
            question: "Як називається комп'ютер, що постійно підключений до мережі та зберігає файли веб-сайту?",
            answers: [
                { text: "Браузер", correct: false },
                { text: "Провайдер", correct: false },
                { text: "Хост / Веб-сервер", correct: true }
            ]
        },
        {
            question: "Яка технологія ховається за абревіатурою HTML?",
            answers: [
                { text: "Мова програмування для серверних обчислень", correct: false },
                { text: "Мова розмітки гіпертексту", correct: true },
                { text: "Протокол безпечного передавання даних", correct: false }
            ]
        },
        {
            question: "За допомогою яких символів у HTML записуються команди (теги)?",
            answers: [
                { text: "&lt; та &gt; (кутові дужки)", correct: true },
                { text: "{ та } (фігурні дужки)", correct: false },
                { text: "[ та ] (квадратні дужки)", correct: false }
            ]
        },
        {
            question: "Який тег є головним контейнером, всередині якого розміщується весь вміст веб-сторінки?",
            answers: [
                { text: "&lt;head&gt;", correct: false },
                { text: "&lt;html&gt;", correct: true },
                { text: "&lt;title&gt;", correct: false }
            ]
        },
        {
            question: "Який тег використовується для відображення основного видимого вмісту сторінки (текст, графіка)?",
            answers: [
                { text: "&lt;body&gt;", correct: true },
                { text: "&lt;head&gt;", correct: false },
                { text: "&lt;meta&gt;", correct: false }
            ]
        },
        {
            question: "Який тег відповідає за створення нового абзацу тексту?",
            answers: [
                { text: "&lt;br&gt;", correct: false },
                { text: "&lt;h1&gt;", correct: false },
                { text: "&lt;p&gt;", correct: true }
            ]
        },
        {
            question: "За допомогою якого тегу можна вставити гіперпосилання на інший ресурс?",
            answers: [
                { text: "&lt;a&gt;", correct: true },
                { text: "&lt;link&gt;", correct: false },
                { text: "&lt;img&gt;", correct: false }
            ]
        },
        {
            question: "Яка послуга надає користувачам місце на сервері для розміщення їхніх сайтів?",
            answers: [
                { text: "Домен", correct: false },
                { text: "Хостинг", correct: true },
                { text: "Адресація", correct: false }
            ]
        },
        {
            question: "Унікальне ім'я сайту в Інтернеті (наприклад, google.com) — це...",
            answers: [
                { text: "Доменне ім'я", correct: true },
                { text: "Веб-сторінка", correct: false },
                { text: "URL-адреса файлу", correct: false }
            ]
        },
        {
            question: "Яку назву має перший етап створення веб-сайту?",
            answers: [
                { text: "Публікація сайту", correct: false },
                { text: "Верстка сторінок", correct: false },
                { text: "Постановка завдання та проєктування (планування)", correct: true }
            ]
        },
        {
            question: "Який із сервісів є прикладом онлайн-конструктора сайтів (CMS без коду)?",
            answers: [
                { text: "Google Сайти (Google Sites)", correct: true },
                { text: "Google Диск", correct: false },
                { text: "Google Клас", correct: false }
            ]
        }
    ];

    let studentName = "";
    let currentIdx = 0;
    let score = 0;
    let userAnswers = [];

    function validateAndStart() {
        const nameInput = document.getElementById("student-name");
        studentName = nameInput.value.trim();
        
        if (studentName.length < 3) {
            alert("Будь ласка, введіть ваше Прізвище та Ім'я!");
            return;
        }
        
        document.getElementById("progress-area").style.display = "block";
        showQuestion();
    }

    function showQuestion() {
        const container = document.getElementById("quiz-content");
        let currentQuestion = quizData[currentIdx];
        
        document.getElementById("progress").style.width = `${(currentIdx / quizData.length) * 100}%`;

        let optionsHtml = "";
        currentQuestion.answers.forEach((answer) => {
            optionsHtml += `<button class="option-btn" onclick="selectAnswer(this, ${answer.correct}, '${answer.text.replace(/'/g, "\\'")}')">${answer.text}</button>`;
        });

        container.innerHTML = `
            <h2>${currentIdx + 1}. ${currentQuestion.question}</h2>
            <div class="options">${optionsHtml}</div>
            <button id="next-btn" class="main-btn" style="display:none;" onclick="nextQuestion()">Далі →</button>
        `;
    }

    function selectAnswer(btn, isCorrect, text) {
        userAnswers.push({
            question: quizData[currentIdx].question,
            selected: text,
            correctAnswer: quizData[currentIdx].answers.find(a => a.correct).text,
            isCorrect: isCorrect
        });

        if (isCorrect) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("wrong");
        }

        const options = document.querySelectorAll(".option-btn");
        options.forEach(button => {
            button.disabled = true;
            if (button.textContent === quizData[currentIdx].answers.find(a => a.correct).text) {
                button.classList.add("correct");
            }
        });

        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function sendToGoogleSheets(name, finalScore) {
        const formData = new FormData();
        formData.append(NAME_ENTRY_ID, name);
        formData.append(SCORE_ENTRY_ID, finalScore);

        fetch(GOOGLE_FORM_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
        }).catch(err => console.log("Data sent"));
    }

    function showResults() {
        document.getElementById("progress").style.width = "100%";
        const container = document.getElementById("quiz-content");
        
        sendToGoogleSheets(studentName, score);
        
        let analysisHtml = "";
        userAnswers.forEach((ans, idx) => {
            const statusClass = ans.isCorrect ? "correct-item" : "wrong-item";
            const statusIcon = ans.isCorrect ? "✅" : "❌";
            analysisHtml += `
                <div class="analysis-item ${statusClass}">
                    <div class="analysis-q">${idx + 1}. ${ans.question}</div>
                    <div class="analysis-ans">
                        Ваша відповідь: <span>${ans.selected}</span> ${statusIcon}<br>
                        ${!ans.isCorrect ? `Правильна відповідь: <strong>${ans.correctAnswer}</strong>` : ''}
                    </div>
                </div>
            `;
        });

        container.innerHTML = `
            <div class="result-screen">
                <h2>Квест завершено, ${studentName}!</h2>
                <p style="color: var(--text-muted); margin-top: 5px;">Ваш результат успішно надіслано в Google Таблицю.</p>
                <div class="score-badge">${score}</div>
                <p>Бал за 12-бальною системою НУШ</p>
                
                <h3 style="margin-top: 35px; text-align: left; color: var(--primary);">Аналіз відповідей та помилок:</h3>
                <div class="analysis-container">
                    ${analysisHtml}
                </div>
                
                <button class="main-btn" onclick="location.reload()">Пройти знову</button>
            </div>
        `;
    }
</script>
</body>
</html>

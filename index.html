<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест: Створення веб-ресурсів | 8 клас НУШ</title>
    <style>
        :root {
            --primary: #4a6fa5;
            --success: #2ec4b6;
            --error: #e71d36;
            --background: #f8f9fa;
            --text: #2b2d42;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .quiz-card {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .progress-container {
            width: 100%;
            background: #eef1f6;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
        }
        h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #1d3557;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background: #ffffff;
            border: 2px solid #e2e8f0;
            padding: 14px 20px;
            border-radius: 10px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f0f4f8;
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--success) !important;
            color: #155724;
            font-weight: bold;
        }
        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: var(--error) !important;
            color: #721c24;
        }
        #next-btn {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }
        #next-btn:hover {
            background: #3b5c88;
        }
        .result-screen {
            text-align: center;
        }
        .score-badge {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin: 20px 0;
        }
        .restart-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }
        .restart-btn:hover {
            background: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="quiz-card" id="quiz">
    <div class="progress-container">
        <div class="progress-bar" id="progress"></div>
    </div>
    <div id="quiz-content">
        <h2 id="question-text">Завантаження питання...</h2>
        <div class="options" id="options-container"></div>
        <button id="next-btn" onclick="nextQuestion()">Далі →</button>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "Що таке HTML?",
            answers: [
                { text: "Мова розмітки гіпертексту", correct: true },
                { text: "Мова програмування для розрахунків", correct: false },
                { text: "Графічний редактор для веб-дизайну", correct: false }
            ]
        },
        {
            question: "За допомогою яких символів записуються теги в коді HTML?",
            answers: [
                { text: "{ та } (фігурні дужки)", correct: false },
                { text: "[ та ] (квадратні дужки)", correct: false },
                { text: "&lt; та &gt; (кутові дужки)", correct: true }
            ]
        },
        {
            question: "Який тег використовується для створення нового абзацу на веб-сторінці?",
            answers: [
                { text: "&lt;p&gt;", correct: true },
                { text: "&lt;br&gt;", correct: false },
                { text: "&lt;title&gt;", correct: false }
            ]
        },
        {
            question: "Який сервіс дозволяє безкоштовно створювати сайти без знання програмування у візуальному конструкторі?",
            answers: [
                { text: "Google Диск", correct: false },
                { text: "Google Сайти (Google Sites)", correct: true },
                { text: "Google Форми", correct: false }
            ]
        },
        {
            question: "Який тег є обов'язковим парним тегом контейнера всього HTML-документа?",
            answers: [
                { text: "&lt;body&gt;", correct: false },
                { text: "&lt;html&gt;", correct: true },
                { text: "&lt;head&gt;", correct: false }
            ]
        }
    ];

    let currentIdx = 0;
    let score = 0;

    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const progressBar = document.getElementById("progress");

    function startQuiz() {
        currentIdx = 0;
        score = 0;
        nextBtn.style.display = "none";
        showQuestion();
    }

    function showQuestion() {
        resetState();
        let currentQuestion = quizData[currentIdx];
        questionText.innerText = `${currentIdx + 1}. ${currentQuestion.question}`;
        
        // Оновлення прогрес-бару
        progressBar.style.width = `${(currentIdx / quizData.length) * 100}%`;

        currentQuestion.answers.forEach(answer => {
            const button = document.createElement("button");
            button.innerHTML = answer.text;
            button.classList.add("option-btn");
            if (answer.correct) {
                button.dataset.correct = answer.correct;
            }
            button.addEventListener("click", selectAnswer);
            optionsContainer.appendChild(button);
        });
    }

    function resetState() {
        nextBtn.style.display = "none";
        while (optionsContainer.firstChild) {
            optionsContainer.removeChild(optionsContainer.firstChild);
        }
    }

    function selectAnswer(e) {
        const selectedBtn = e.target;
        const isCorrect = selectedBtn.dataset.correct === "true";
        
        if (isCorrect) {
            selectedBtn.classList.add("correct");
            score++;
        } else {
            selectedBtn.classList.add("wrong");
        }

        // Блокуємо інші кнопки та показуємо правильну відповідь
        Array.from(optionsContainer.children).forEach(button => {
            if (button.dataset.correct === "true") {
                button.classList.add("correct");
            }
            button.disabled = true;
        });

        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        resetState();
        progressBar.style.width = "100%";
        
        // Розрахунок оцінки за 12-бальною системою НУШ
        const nushGrade = Math.round((score / quizData.length) * 12);
        
        document.getElementById("quiz-content").innerHTML = `
            <div class="result-screen">
                <h2>Тест завершено!</h2>
                <p>Правильних відповідей: <strong>${score} з ${quizData.length}</strong></p>
                <div class="score-badge">${nushGrade}</div>
                <p>Ваша оцінка за 12-бальною системою НУШ</p>
                <button class="restart-btn" onclick="location.reload()">Пройти знову</button>
            </div>
        `;
    }

    startQuiz();
</script>

</body>
</html>
